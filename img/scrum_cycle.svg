<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">Cycle de vie Scrum</title>
  <desc id="description">Illustration du processus Scrum avec un carnet de produit, une réunion de planification, un carnet de sprint, un sprint de une à quatre semaines, le travail terminé, une revue et une rétrospective.</desc>
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #1E293B; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #1E293B; text-anchor: middle; }
      .circleText { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .side { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #7C3AED; }
      .stroke { stroke: #FFFFFF; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="620" fill="#FFFFFF"/>
  <text class="title" x="800" y="55">Cycle de vie Scrum</text>

  <!-- Ligne de progression -->
  <path d="M 170 360 H 1190" stroke="#A78BFA" stroke-width="36" stroke-linecap="round"/>
  <path d="M 170 360 H 1190" stroke="#DDD6FE" stroke-width="14" stroke-linecap="round"/>

  <!-- Product owner -->
  <g transform="translate(155 120)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#14B8A6" stroke-width="4"/>
    <path d="M-25 50 C-20 20,20 20,25 50 M0 15 V35 M-17 35 H17" fill="none" stroke="#14B8A6" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text class="label" x="155" y="214">Product</text>
  <text class="label" x="155" y="241">Owner</text>

  <!-- Équipe -->
  <g transform="translate(405 155)" stroke="#F97316" stroke-width="4" fill="none">
    <circle cx="-12" cy="-10" r="11"/><circle cx="14" cy="-10" r="11"/>
    <path d="M-34 31 C-31 6,5 6,8 31 M-5 31 C-2 6,34 6,38 31"/>
  </g>
  <text class="label" x="405" y="245">L'équipe</text>

  <!-- Scrum master -->
  <g transform="translate(805 92)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#14B8A6" stroke-width="4"/>
    <path d="M-25 50 C-20 20,20 20,25 50 M0 15 V35 M-17 35 H17" fill="none" stroke="#14B8A6" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text class="label" x="805" y="150">Scrum Master</text>

  <!-- Carnet de produit -->
  <g transform="translate(155 360)">
    <circle r="100" fill="#14B8A6"/>
    <text class="circleText" y="-22">Carnet</text><text class="circleText" y="5">de produit</text>
    <rect x="-20" y="30" width="40" height="53" rx="3" class="stroke"/>
    <path d="M-8 30 V18 H8 V30 M-9 47 H9 M-9 61 H9 M-9 75 H4" class="stroke"/>
  </g>

  <!-- Réunion de planification -->
  <g transform="translate(405 360)">
    <circle r="100" fill="#F97316"/>
    <text class="circleText" y="-36">Réunion de</text><text class="circleText" y="-9">planification</text><text class="circleText" y="18">de sprint</text>
    <rect x="-20" y="35" width="40" height="50" rx="3" class="stroke"/>
    <path d="M-8 26 V43 H8 V26 M-8 54 H9 M-8 68 H2" class="stroke"/>
  </g>

  <!-- Carnet de sprint -->
  <g transform="translate(655 360)">
    <circle r="100" fill="#F97316"/>
    <text class="circleText" y="-22">Carnet</text><text class="circleText" y="5">de sprint</text>
    <path d="M-29 30 H2 V70 H-29 Z M-12 19 H19 V59 H-12 Z M5 8 H36 V48 H5 Z" class="stroke"/>
  </g>

  <!-- Sprint, sans boucle bleue -->
  <circle cx="816" cy="260" r="112" fill="#F3E8FF" stroke="#7C3AED" stroke-width="8"/>
  <text class="label" x="816" y="220">Sprint de</text><text class="label" x="816" y="247">1 à 4 semaines</text>
  <text x="816" y="278" font-family="Arial, sans-serif" font-size="15" fill="#334155" text-anchor="middle">Durée fixe et objectif</text>
  <text x="816" y="298" font-family="Arial, sans-serif" font-size="15" fill="#334155" text-anchor="middle">de sprint défini par</text>
  <text x="816" y="318" font-family="Arial, sans-serif" font-size="15" fill="#334155" text-anchor="middle">l'équipe Scrum</text>
  <text class="side" x="990" y="215">Mêlée</text><text class="side" x="990" y="240">quotidienne</text>

  <!-- Travail terminé -->
  <g transform="translate(1150 360)">
    <circle r="100" fill="#F97316"/>
    <text class="circleText" y="-22">Travail</text><text class="circleText" y="5">terminé</text>
    <rect x="-20" y="30" width="40" height="52" rx="3" class="stroke"/>
    <path d="M-8 30 V19 H8 V30 M-8 49 H8 M-8 63 L-1 72 L11 54" class="stroke"/>
  </g>

  <!-- Revue et rétrospective -->
  <g transform="translate(1350 280)" stroke="#7C3AED" stroke-width="4" fill="none">
    <circle cx="-12" cy="-12" r="11"/><circle cx="14" cy="-12" r="11"/>
    <path d="M-34 30 C-31 5,5 5,8 30 M-5 30 C-2 5,34 5,38 30"/>
  </g>
  <text class="side" x="1310" y="357">Revue</text><text class="side" x="1310" y="385">de sprint</text>
  <text class="side" x="1350" y="420">+</text>
  <text class="side" x="1285" y="450">Rétrospective</text><text class="side" x="1312" y="478">de sprint</text>
</svg>
