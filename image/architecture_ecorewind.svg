  <text x="800" y="120" text-anchor="middle" class="label">Utilisateurs</text>
  <text x="800" y="148" text-anchor="middle" class="small" fill="#fff">Citoyen • Éducateur • Collecteur • Gestionnaire • Administrateur</text>

  <rect x="555" y="245" width="490" height="135" class="box" fill="#f9d7be" stroke="#d8782f"/>
