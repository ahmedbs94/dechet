  <rect x="1240" y="518" width="225" height="65" class="box" fill="#fff" stroke="#7452a8"/><text x="1352" y="547" text-anchor="middle" class="small">Authentication • RTDB</text><text x="1352" y="571" text-anchor="middle" class="small">Cloud Messaging</text>

  <rect x="555" y="700" width="490" height="100" class="box" fill="#d9e9fb" stroke="#2563eb"/>
