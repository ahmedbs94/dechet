<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#23354d"/></marker>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#172554}.label{font:700 20px Arial,sans-serif;fill:#fff}.text{font:18px Arial,sans-serif;fill:#172554}.small{font:16px Arial,sans-serif;fill:#172554}.line{stroke:#23354d;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:10 7;fill:none}.box{stroke-width:3;rx:12;ry:12}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
