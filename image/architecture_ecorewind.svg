  <rect x="585" y="515" width="125" height="70" class="box" fill="#fff" stroke="#d97706"/><text x="647" y="544" text-anchor="middle" class="small">Authentification</text><text x="647" y="568" text-anchor="middle" class="small">JWT / RBAC</text>
  <rect x="737" y="515" width="125" height="70" class="box" fill="#fff" stroke="#d97706"/><text x="800" y="544" text-anchor="middle" class="small">Services métier</text><text x="800" y="568" text-anchor="middle" class="small">API REST</text>
  <rect x="890" y="515" width="125" height="70" class="box" fill="#fff" stroke="#d97706"/><text x="952" y="544" text-anchor="middle" class="small">QR, scores et</text><text x="952" y="568" text-anchor="middle" class="small">notifications</text>

  <rect x="105" y="455" width="285" height="165" class="box" fill="#d9eef8" stroke="#167aa8"/>
