 <rect x="75" y="890" width="1645" height="85" rx="15" fill="#e2e8f0"/><text x="900" y="927" class="x" text-anchor="middle">Principe de sécurité : le client Flutter ne modifie pas directement les nœuds Firebase sensibles.</text><text x="900" y="956" class="p" text-anchor="middle">FastAPI authentifie, autorise, valide les règles métier, persiste les données et synchronise les informations temps réel.</text>
