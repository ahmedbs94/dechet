<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
 <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#334155"/></marker><style>.t{font:700 34px Arial;fill:#123047}.s{font:18px Arial;fill:#52616b}.h{font:700 22px Arial;fill:#fff}.x{font:18px Arial;fill:#172554}.p{font:16px Arial;fill:#172554}.b{stroke-width:3;rx:18;ry:18}.l{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#a)}.tag{font:15px Arial;fill:#475569}</style></defs>
 <rect width="1800" height="1050" fill="#f8fafc"/><text x="900" y="56" class="t" text-anchor="middle">Architecture technique et flux de données d'EcoRewind</text><text x="900" y="87" class="s" text-anchor="middle">Les opérations critiques sont validées par FastAPI ; le client Flutter consulte Firebase en lecture seule.</text>
 <rect x="75" y="180" width="290" height="250" class="b" fill="#dbeafe" stroke="#2563eb"/><rect x="75" y="180" width="290" height="55" rx="18" fill="#2563eb"/><text x="220" y="216" class="h" text-anchor="middle">Client Flutter</text><text x="220" y="280" class="x" text-anchor="middle">Application mobile / web</text><text x="220" y="318" class="p" text-anchor="middle">Interface utilisateur</text><text x="220" y="350" class="p" text-anchor="middle">Requêtes HTTP / JSON</text><text x="220" y="382" class="p" text-anchor="middle">Écoute des flux Firebase</text>
 <rect x="525" y="150" width="355" height="315" class="b" fill="#ffedd5" stroke="#ea580c"/><rect x="525" y="150" width="355" height="55" rx="18" fill="#ea580c"/><text x="702" y="186" class="h" text-anchor="middle">Backend FastAPI</text><text x="702" y="253" class="x" text-anchor="middle">API REST et logique métier</text><text x="702" y="291" class="p" text-anchor="middle">Authentification JWT / RBAC / OTP</text><text x="702" y="323" class="p" text-anchor="middle">Validation des scans et opérations</text><text x="702" y="355" class="p" text-anchor="middle">Services, routeurs et tâches de fond</text><text x="702" y="402" class="p" text-anchor="middle">Firebase Admin SDK</text>
