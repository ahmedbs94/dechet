 <rect x="1080" y="455" width="275" height="340" class="b" fill="#fef3c7" stroke="#d97706"/><rect x="1080" y="455" width="275" height="55" rx="18" fill="#d97706"/><text x="1217" y="491" class="h" text-anchor="middle">Firebase</text><text x="1217" y="555" class="x" text-anchor="middle">Services temps réel</text><text x="1217" y="596" class="p" text-anchor="middle">Authentication</text><text x="1217" y="628" class="p" text-anchor="middle">Realtime Database</text><text x="1217" y="660" class="p" text-anchor="middle">Cloud Messaging</text><text x="1217" y="706" class="p" text-anchor="middle">Scores, bacs et statistiques</text><text x="1217" y="744" class="tag" text-anchor="middle">Écritures via backend uniquement</text>
 <rect x="1450" y="455" width="270" height="230" class="b" fill="#dcfce7" stroke="#16a34a"/><rect x="1450" y="455" width="270" height="55" rx="18" fill="#16a34a"/><text x="1585" y="491" class="h" text-anchor="middle">Terrain IoT</text><text x="1585" y="554" class="x" text-anchor="middle">Bacs intelligents</text><text x="1585" y="592" class="p" text-anchor="middle">QR code et capteurs</text><text x="1585" y="624" class="p" text-anchor="middle">État et poids</text>
 <rect x="525" y="660" width="355" height="160" class="b" fill="#e0f2fe" stroke="#0284c7"/><text x="702" y="715" class="x" text-anchor="middle">Notifications et mises à jour</text><text x="702" y="751" class="p" text-anchor="middle">Firebase Cloud Messaging</text><text x="702" y="784" class="p" text-anchor="middle">Données synchronisées en temps réel</text>
