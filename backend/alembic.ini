# alembic.ini — Configuration Alembic pour EcoRewind
# L'URL réelle est lue depuis DATABASE_URL dans alembic/env.py (via .env)
# Ne pas mettre de credentials ici.

[alembic]
# Chemin vers le répertoire des scripts de migration
script_location = alembic

# Format du nom des fichiers de révision
file_template = %%(rev)s_%%(slug)s

# Longueur max du slug (nom court de la migration)
truncate_slug_length = 40

# Activer la comparaison des types de colonnes lors de --autogenerate
# (utile pour détecter Float→Double, String(50)→String(100), etc.)
compare_type = true

# Comparer les valeurs par défaut côté serveur
compare_server_default = false

# sqlalchemy.url est INTENTIONNELLEMENT vide ici.
# Il est défini dynamiquement dans alembic/env.py depuis DATABASE_URL.
sqlalchemy.url =


[post_write_hooks]
# Hooks optionnels après génération (ex: black, isort)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
