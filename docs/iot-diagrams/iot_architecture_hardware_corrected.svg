<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#17365d}
      .subtitle{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#444}
      .boxTitle{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#111}
      .txt{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#222}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#333}
      .pin{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#111}
      .wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke-dasharray:8 8}
      .panel{fill:#ffffff;stroke:#9aa7b2;stroke-width:2;rx:14;ry:14}
      .sensor{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2;rx:12;ry:12}
      .act{fill:#ffebee;stroke:#b71c1c;stroke-width:2;rx:12;ry:12}
      .io{fill:#fff8e1;stroke:#f57f17;stroke-width:2;rx:12;ry:12}
      .cloud{fill:#f3e5f5;stroke:#6a1b9a;stroke-width:2;rx:12;ry:12}
      .core{fill:#e3f2fd;stroke:#0d47a1;stroke-width:3;rx:18;ry:18}
      .power{fill:#fff3e0;stroke:#e65100;stroke-width:2;rx:12;ry:12}
    </style>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c62828"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ef6c00"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6a1b9a"/></marker>
  </defs>

  <rect width="1600" height="1000" fill="#f7f9fb"/>
  <text x="800" y="48" text-anchor="middle" class="title">ECOREWIND — ARCHITECTURE MATÉRIELLE IOT CORRIGÉE</text>
  <text x="800" y="75" text-anchor="middle" class="subtitle">ESP32-CAM AI Thinker, QR code, pesée HX711, servomoteurs, LCD I²C, Firebase et Deep Sleep</text>

  <!-- Panels -->
  <rect x="35" y="105" width="390" height="515" class="panel"/>
  <text x="230" y="135" text-anchor="middle" class="boxTitle" fill="#2e7d32">CAPTEURS / ENTRÉES</text>

  <rect x="1180" y="105" width="385" height="430" class="panel"/>
  <text x="1372" y="135" text-anchor="middle" class="boxTitle" fill="#b71c1c">ACTIONNEURS / SORTIES</text>

  <!-- ESP32 core -->
  <rect x="585" y="170" width="430" height="340" class="core"/>
  <text x="800" y="210" text-anchor="middle" class="boxTitle" style="font-size:26px;fill:#0d47a1">ESP32-CAM AI Thinker</text>
  <rect x="710" y="245" width="180" height="120" fill="#263238" stroke="#111" stroke-width="3" rx="10"/>
  <circle cx="800" cy="305" r="38" fill="#111" stroke="#607d8b" stroke-width="6"/>
  <circle cx="800" cy="305" r="18" fill="#263238" stroke="#90a4ae" stroke-width="4"/>
  <text x="800" y="398" text-anchor="middle" class="txt" style="font-weight:700">Caméra OV2640 intégrée</text>
  <text x="800" y="425" text-anchor="middle" class="txt">Lecture du QR code via ESP32QRCodeReader</text>
  <text x="800" y="455" text-anchor="middle" class="small">Wi-Fi • FreeRTOS Queue • Deep Sleep EXT0</text>

  <!-- Sensors -->
  <rect x="70" y="165" width="310" height="105" class="sensor"/>
  <text x="225" y="195" text-anchor="middle" class="boxTitle">PIR HC-SR505</text>
  <text x="225" y="220" text-anchor="middle" class="txt">Détection présence / réveil</text>
  <text x="225" y="246" text-anchor="middle" class="pin">OUT → GPIO 14</text>

  <rect x="70" y="310" width="310" height="105" class="sensor"/>
  <text x="225" y="340" text-anchor="middle" class="boxTitle">Cellule de charge</text>
  <text x="225" y="365" text-anchor="middle" class="txt">Mesure mécanique du poids</text>
  <text x="225" y="391" text-anchor="middle" class="small">Connectée au module HX711</text>

  <rect x="70" y="455" width="310" height="125" class="sensor"/>
  <text x="225" y="485" text-anchor="middle" class="boxTitle">Module HX711</text>
  <text x="225" y="512" text-anchor="middle" class="pin">DOUT → GPIO 1</text>
  <text x="225" y="537" text-anchor="middle" class="pin">SCK → GPIO 3</text>
  <text x="225" y="562" text-anchor="middle" class="small">Calibration : facteur 98520</text>

  <!-- Actuators -->
  <rect x="1220" y="165" width="300" height="100" class="act"/>
  <text x="1370" y="195" text-anchor="middle" class="boxTitle">Servo utilisateur</text>
  <text x="1370" y="220" text-anchor="middle" class="txt">Couvercle dépôt citoyen</text>
  <text x="1370" y="246" text-anchor="middle" class="pin">PWM → GPIO 2 • 5 s</text>

  <rect x="1220" y="300" width="300" height="100" class="act"/>
  <text x="1370" y="330" text-anchor="middle" class="boxTitle">Servo collecteur</text>
  <text x="1370" y="355" text-anchor="middle" class="txt">Couvercle vidage bac</text>
  <text x="1370" y="381" text-anchor="middle" class="pin">PWM → GPIO 4 • 8 s</text>

  <rect x="1220" y="435" width="300" height="80" class="io"/>
  <text x="1370" y="463" text-anchor="middle" class="boxTitle">LCD I²C 16×2</text>
  <text x="1370" y="488" text-anchor="middle" class="pin">SDA → GPIO 15 • SCL → GPIO 13</text>

  <!-- Firebase -->
  <rect x="1135" y="650" width="390" height="180" class="cloud"/>
  <text x="1330" y="685" text-anchor="middle" class="boxTitle">Firebase Realtime Database</text>
  <text x="1165" y="720" class="txt">• /utilisateurs/{qrID}/role</text>
  <text x="1165" y="747" class="txt">• /utilisateurs/{qrID}/score</text>
  <text x="1165" y="774" class="txt">• /poubelles/BIN-GENERAL-001/poids</text>
  <text x="1165" y="801" class="txt">• /poubelles/BIN-GENERAL-001/etat</text>

  <rect x="690" y="670" width="230" height="95" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="18"/>
  <text x="805" y="705" text-anchor="middle" class="boxTitle">Routeur Wi-Fi</text>
  <path d="M760 735 Q805 700 850 735" fill="none" stroke="#1565c0" stroke-width="5"/>
  <path d="M775 750 Q805 728 835 750" fill="none" stroke="#1565c0" stroke-width="4"/>
  <circle cx="805" cy="760" r="6" fill="#1565c0"/>

  <!-- Power -->
  <rect x="70" y="700" width="520" height="190" class="power"/>
  <text x="330" y="735" text-anchor="middle" class="boxTitle">Alimentation corrigée</text>
  <text x="100" y="770" class="txt">• Adaptateur stabilisé : 5 V / 3 A minimum</text>
  <text x="100" y="797" class="txt">• Rail 5 V pour ESP32-CAM, LCD et servos</text>
  <text x="100" y="824" class="txt">• Servos NON alimentés par le 3,3 V de l’ESP32</text>
  <text x="100" y="851" class="txt">• Masse commune GND entre tous les modules</text>
  <text x="100" y="878" class="txt">• Condensateur 470–1000 µF près des servos</text>

  <!-- Deep Sleep note -->
  <rect x="660" y="825" width="470" height="105" fill="#ffffff" stroke="#607d8b" stroke-width="2" rx="12"/>
  <text x="895" y="858" text-anchor="middle" class="boxTitle">Gestion énergétique</text>
  <text x="690" y="888" class="txt">Absence ≥ 10 s → LCD off, Wi-Fi off, HX711 power_down,</text>
  <text x="690" y="913" class="txt">servos détachés → Deep Sleep → réveil par PIR GPIO14.</text>

  <!-- Wires -->
  <path d="M380 217 L585 260" class="wire" stroke="#2e7d32" marker-end="url(#arrowGreen)"/>
  <text x="445" y="218" class="pin">GPIO 14</text>

  <path d="M380 362 L470 362 L470 505 L585 455" class="wire" stroke="#2e7d32" marker-end="url(#arrowGreen)"/>
  <text x="420" y="352" class="small">signal poids</text>

  <path d="M380 510 L585 390" class="wire" stroke="#1565c0" marker-end="url(#arrowBlue)"/>
  <path d="M380 545 L585 425" class="wire" stroke="#1565c0" marker-end="url(#arrowBlue)"/>
  <text x="440" y="500" class="pin">DOUT GPIO1</text>
  <text x="440" y="545" class="pin">SCK GPIO3</text>

  <path d="M1015 230 L1220 215" class="wire" stroke="#c62828" marker-end="url(#arrowRed)"/>
  <text x="1085" y="213" class="pin">GPIO 2 PWM</text>

  <path d="M1015 320 L1220 350" class="wire" stroke="#c62828" marker-end="url(#arrowRed)"/>
  <text x="1085" y="345" class="pin">GPIO 4 PWM</text>

  <path d="M1015 440 L1220 475" class="wire" stroke="#ef6c00" marker-end="url(#arrowOrange)"/>
  <text x="1070" y="466" class="pin">SDA 15 / SCL 13</text>

  <path d="M805 510 L805 670" class="wire dash" stroke="#1565c0" marker-end="url(#arrowBlue)"/>
  <path d="M920 720 L1135 735" class="wire dash" stroke="#1565c0" marker-end="url(#arrowBlue)"/>
  <text x="880" y="630" class="pin">Wi-Fi</text>

  <path d="M590 790 L650 790 L650 510" class="wire" stroke="#ef6c00" marker-end="url(#arrowOrange)"/>
  <text x="610" y="775" class="pin">5 V + GND</text>

  <path d="M590 840 L1180 840 L1180 215 L1220 215" class="wire" stroke="#ef6c00" marker-end="url(#arrowOrange)" opacity="0.55"/>
  <path d="M590 860 L1190 860 L1190 350 L1220 350" class="wire" stroke="#ef6c00" marker-end="url(#arrowOrange)" opacity="0.55"/>

  <!-- Legend -->
  <rect x="1135" y="865" width="390" height="90" fill="#ffffff" stroke="#9aa7b2" stroke-width="2" rx="12"/>
  <text x="1330" y="892" text-anchor="middle" class="boxTitle">Légende</text>
  <line x1="1160" y1="915" x2="1215" y2="915" stroke="#2e7d32" stroke-width="4"/><text x="1230" y="920" class="small">Entrées capteurs</text>
  <line x1="1160" y1="940" x2="1215" y2="940" stroke="#c62828" stroke-width="4"/><text x="1230" y="945" class="small">Commandes PWM servos</text>
  <line x1="1360" y1="915" x2="1415" y2="915" stroke="#1565c0" stroke-width="4" stroke-dasharray="8 8"/><text x="1430" y="920" class="small">Wi-Fi</text>
  <line x1="1360" y1="940" x2="1415" y2="940" stroke="#ef6c00" stroke-width="4"/><text x="1430" y="945" class="small">Alimentation</text>
</svg>
